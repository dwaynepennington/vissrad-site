<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VissRad Markup — VissRad Suite</title>
<link rel="icon" href="../assets/vissrad.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/app_icon_32.png">
<link rel="apple-touch-icon" href="../assets/app_icon_256.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0d1014">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/shell.css">
<style>
  .vm-wrap { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 12px; padding: 12px 16px; }
  .vm-drop { border: 1.5px dashed var(--border-hi); border-radius: var(--radius); padding: 26px 16px; text-align: center; color: var(--text-dim); font-size: 13px; line-height: 1.5; }
  .vm-drop.over { border-color: var(--accent); color: var(--text); background: var(--panel-alt); }
  .vm-drop button { margin-top: 10px; }
  .vm-note { color: var(--text-dim); font-size: 12px; line-height: 1.5; margin: 10px 0 0; }
  .vm-sub { font-size: 10.5px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text-dim); margin: 16px 0 0; padding-top: 12px; border-top: 1px solid var(--border); }
  .vm-recent { display: grid; gap: 4px; margin-top: 8px; }
  .vm-recent div { font-size: 12px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vm-bar { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .vm-bar input, .vm-bar select { font: inherit; font-size: 12.5px; padding: 5px 8px; background: var(--bg); color: var(--text); border: 1px solid var(--border-hi); border-radius: var(--radius); }
  .vm-bar input { flex: 1; min-width: 120px; }
  .vm-count { color: var(--text-faint); font-size: 11.5px; white-space: nowrap; }
  .vm-list { max-height: calc(100vh - 250px); }
  @media (max-width: 900px) { .vm-wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="loading">
  <img src="../assets/vissrad_logo_light.png" alt="VissRad" id="load-logo">
  <div class="t">Loading VissRad Markup&hellip;</div>
</div>

<div id="app" hidden>
  <main id="views"></main>
  <footer class="statusbar" id="statusbar"></footer>
</div>

<script src="../shared/usermode.js"></script>
<script src="../shared/lib.js"></script>
<script src="../shared/shell.js"></script>
<script src="app.js"></script>
</body>
</html>
