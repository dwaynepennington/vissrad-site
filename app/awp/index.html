<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VissRadAWP — Advanced Work Packaging</title>
<link rel="icon" href="../assets/vissrad.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/app_icon_32.png">
<link rel="apple-touch-icon" href="../assets/app_icon_256.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0d1014">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/shell.css">
<style>
  /* Contained sub-section header for panels within a card body — deliberately
     does not use negative margins so it never grows scrollWidth past the
     card-body's own padding box (see QA harness overflow check). */
  .subhead {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.8px;
    text-transform: uppercase; color: var(--text-dim);
    margin: 14px 0 8px; padding-top: 10px; border-top: 1px solid var(--border);
  }
  .subhead:first-child { margin-top: 0; padding-top: 0; border-top: none; }
  /* The compact constraint checklist has 6 columns in a narrow detail panel;
     table.data's default white-space:nowrap on every column lets the row's
     minimum content width exceed the panel, causing a small horizontal
     overflow. table-layout:fixed with explicit widths keeps every column
     inside the panel and lets the category text wrap instead. */
  table.data.constraints { table-layout: fixed; }
  table.data.constraints col.c-category { width: 20%; }
  table.data.constraints col.c-status { width: 21%; }
  table.data.constraints col.c-blocking { width: 11%; }
  table.data.constraints col.c-owner { width: 17%; }
  table.data.constraints col.c-due { width: 18%; }
  table.data.constraints col.c-action { width: 13%; }
  table.data.constraints td, table.data.constraints th { white-space: normal; overflow-wrap: break-word; }
  table.data.constraints td:last-child { overflow: visible; text-overflow: initial; }
  table.data.constraints th { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  table.data.constraints td.mono { white-space: nowrap; font-size: 11px; }
  table.data.constraints td .pill { max-width: 100%; padding-left: 6px; padding-right: 6px; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }
  table.data.constraints th, table.data.constraints td { padding-left: 6px; padding-right: 6px; }
  table.data.constraints td .ghost { padding: 4px 8px; font-size: 11px; white-space: nowrap; }
  .wf-appr-row{display:flex;gap:8px;align-items:center;padding:3px 0}
  .wf-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--text-dim);margin:6px 0}
  .wf-stage{position:relative;aspect-ratio:1000/620;width:100%}
  .wf-map{width:100%;height:100%;display:block}
  .wf-map.picking{cursor:crosshair;touch-action:none}
  .wf-area{fill:color-mix(in srgb,var(--text) 4%,transparent);stroke:var(--border)}
  .wf-area-lbl{fill:var(--text-dim);font-size:12px}
  .wf-dot{cursor:pointer}
  .wf-dot.hi{stroke:var(--text);stroke-width:1.5}
  .wf-box{fill:color-mix(in srgb,var(--blue) 15%,transparent);stroke:var(--blue);stroke-dasharray:4}
  .wf-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
  .wf-rules li{margin:4px 0}
  table.data.mini td{white-space:normal}
  table.data.mini td:first-child{white-space:nowrap}
  table.data.mini + .subhead{margin-top:14px}
  table.data.mini select{min-width:0;width:auto;max-width:128px;padding:3px 6px;font-size:12px}
</style>
</head>
<body>

<div id="loading">
  <img src="../assets/vissrad_logo_light.png" alt="VissRad" id="load-logo">
  <div class="t">Loading work packages&hellip;</div>
</div>

<div id="app" hidden>
  <nav class="tabs" id="tabs"></nav>
  <main id="views"></main>
  <footer class="statusbar" id="statusbar"></footer>
</div>

<script src="../shared/usermode.js"></script>
<script src="../shared/lib.js"></script>
<script src="../shared/shell.js"></script>
<script src="../shared/records.js"></script>
<script src="meetings.js"></script>
<script src="../shared/xerParser.js"></script>
<script src="../shared/markup.js"></script>
<script src="workface.js"></script>
<script src="app.js"></script>
</body>
</html>
