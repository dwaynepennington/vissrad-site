<style>
  /* Contained sub-section header inside a card body — no negative margins, so
     it can never grow the card's scrollWidth (see suite QA overflow check). */
  .subhead {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.8px;
    text-transform: uppercase; color: var(--text-dim);
    margin: 14px 0 8px; padding-top: 10px; border-top: 1px solid var(--border);
  }
  .subhead:first-child { margin-top: 0; padding-top: 0; border-top: none; }
  /* Compact tables shown inside the narrow master/detail panel: table.data's
     default nowrap lets the row's min-content width exceed the panel, so these
     are fixed-layout and allowed to wrap instead. */
  table.data.fit { table-layout: fixed; }
  table.data.fit td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  table.data.fit th { white-space: nowrap; overflow: hidden; }
  table.data.fit td:last-child { overflow: visible; text-overflow: initial; }
  table.data.fit td .ghost { padding: 4px 8px; font-size: 11px; white-space: nowrap; }
</style>
</head>
