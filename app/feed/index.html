<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VissRadFEED — Front-End Engineering Design</title>
<link rel="icon" href="../assets/vissrad.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/app_icon_32.png">
<link rel="apple-touch-icon" href="../assets/app_icon_256.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/shell.css">
<style>
  /* Contained sub-section header for panels within a card body — no negative
     margins, so it never grows scrollWidth past the card-body padding box. */
  .subhead {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.8px;
    text-transform: uppercase; color: var(--text-dim);
    margin: 14px 0 8px; padding-top: 10px; border-top: 1px solid var(--border);
  }
  .subhead:first-child { margin-top: 0; padding-top: 0; border-top: none; }
  /* The gate checklist and the milestone skeleton both carry long requirement
     text in a narrow detail panel. table.data defaults to white-space:nowrap
     on every cell, which lets the row's minimum content width exceed the
     panel and produce a horizontal scrollbar; fixed layout with explicit
     column widths wraps the text instead. */
  table.data.fixed { table-layout: fixed; }
  table.data.fixed td, table.data.fixed th {
    white-space: normal; word-break: break-word;
  }
  table.data.fixed td:last-child { overflow: visible; text-overflow: initial; }
  table.data.fixed td .ghost {
    padding: 4px 8px; font-size: 11px; white-space: nowrap;
  }
  table.data.ck col.c-req { width: 44%; }
  table.data.ck col.c-cat { width: 13%; }
  table.data.ck col.c-own { width: 13%; }
  table.data.ck col.c-wt { width: 8%; }
  table.data.ck col.c-st { width: 11%; }
  table.data.ck col.c-act { width: 11%; }
  table.data.ms col.c-seq { width: 5%; }
  table.data.ms col.c-name { width: 33%; }
  table.data.ms col.c-code { width: 7%; }
  table.data.ms col.c-pctd { width: 9%; }
  table.data.ms col.c-date { width: 11%; }
  table.data.ms col.c-stat { width: 12%; }
  table.data.ms col.c-var { width: 8%; }
  table.data.ms col.c-act { width: 10%; }
  /* Benchmark inputs sit two columns wide on a desktop card and collapse to
     one on narrow viewports. */
  .bm-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 22px; }
  @media (max-width: 900px) { .bm-inputs { grid-template-columns: 1fr; } }
  .bm-inputs .form-grid { grid-template-columns: 132px 1fr; }
  .note-synth {
    font-size: 11.5px; line-height: 1.6; color: var(--text-dim);
    border-left: 2px solid var(--amber); padding: 2px 0 2px 10px;
  }
</style>
</head>
<body>

<div id="loading">
  <img src="../assets/vissrad_logo_light.png" alt="VissRad" id="load-logo">
  <div class="t">Loading FEED gate data&hellip;</div>
</div>

<div id="app" hidden>
  <nav class="tabs" id="tabs"></nav>
  <main id="views"></main>
  <footer class="statusbar" id="statusbar"></footer>
</div>

<script src="../shared/lib.js"></script>
<script src="../shared/shell.js"></script>
<script src="app.js"></script>
</body>
</html>
