<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VissRadAI — Project Assistant</title>
<link rel="icon" href="../assets/vissrad.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/app_icon_32.png">
<link rel="apple-touch-icon" href="../assets/app_icon_256.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0d1014">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/shell.css">
<style>
  .ai-wrap { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 12px; min-height: calc(100vh - 190px); }
  .ai-side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .ai-side .card-body { display: grid; gap: 6px; }
  .ai-sugg { text-align: left; white-space: normal !important; overflow: visible !important; text-overflow: clip !important; height: auto !important; width: 100%; justify-content: flex-start; line-height: 1.35; padding: 7px 9px; font-size: 12.5px; }
  .ai-main { display: flex; flex-direction: column; min-width: 0; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); }
  .ai-log { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; min-height: 360px; max-height: calc(100vh - 290px); }
  .ai-msg { max-width: 920px; line-height: 1.55; font-size: 13.5px; }
  .ai-msg.user { align-self: flex-end; background: var(--panel-hi); border: 1px solid var(--border-hi); border-radius: 8px; padding: 9px 12px; max-width: 72%; white-space: pre-wrap; }
  .ai-msg.assistant { align-self: stretch; }
  .ai-msg.assistant p { margin: 0 0 8px; }
  .ai-msg.assistant h3, .ai-msg.assistant h4 { font-size: 13.5px; margin: 12px 0 6px; }
  .ai-msg.assistant ul, .ai-msg.assistant ol { margin: 4px 0 8px 20px; padding: 0; }
  .ai-msg.assistant code { font-family: var(--mono); font-size: 12px; background: var(--panel-alt); padding: 1px 4px; border-radius: 3px; }
  .ai-msg.assistant table { border-collapse: collapse; margin: 6px 0 10px; font-size: 12.5px; }
  .ai-msg.assistant th, .ai-msg.assistant td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
  .ai-msg.assistant th { background: var(--panel-alt); color: var(--text-dim); font-weight: 600; }
  .ai-msg.assistant a { color: var(--blue); }
  .ai-who { font-size: 11px; color: var(--text-faint); margin-bottom: 4px; letter-spacing: .4px; text-transform: uppercase; }
  .ai-steps { font-size: 12px; color: var(--text-dim); margin: 0 0 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .ai-step { border: 1px solid var(--border); border-radius: 10px; padding: 2px 8px; background: var(--panel-alt); }
  .ai-input { border-top: 1px solid var(--border); padding: 10px; display: flex; gap: 8px; align-items: flex-end; }
  .ai-input textarea { flex: 1; resize: vertical; min-height: 44px; max-height: 200px; font: inherit; font-size: 13.5px; padding: 8px 10px;
    background: var(--bg); color: var(--text); border: 1px solid var(--border-hi); border-radius: var(--radius); }
  .ai-foot { font-size: 11.5px; color: var(--text-faint); padding: 0 12px 10px; }
  .ai-busy { color: var(--text-dim); font-size: 12.5px; }
  .ai-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; max-width: 900px; }
  .ai-form label { display: grid; gap: 4px; font-size: 12px; color: var(--text-dim); }
  .ai-form input, .ai-form select { font: inherit; padding: 6px 8px; background: var(--bg); color: var(--text); border: 1px solid var(--border-hi); border-radius: var(--radius); }
  @media (max-width: 900px) { .ai-wrap { grid-template-columns: 1fr; } .ai-form { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="loading">
  <img src="../assets/vissrad_logo_light.png" alt="VissRad" id="load-logo">
  <div class="t">Loading VissRadAI&hellip;</div>
</div>

<div id="app" hidden>
  <nav class="tabs" id="tabs"></nav>
  <main id="views"></main>
  <footer class="statusbar" id="statusbar"></footer>
</div>
<div id="ai-frames" aria-hidden="true" style="position:fixed;left:-20000px;top:0;width:1400px;height:900px;visibility:hidden;pointer-events:none"></div>

<script src="../shared/usermode.js"></script>
<script src="../shared/lib.js"></script>
<script src="../shared/shell.js"></script>
<script src="app.js"></script>
</body>
</html>
